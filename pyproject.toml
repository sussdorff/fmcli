[project]
name = "fmcli"
version = "0.0.0.dev0"
description = "Multi-account Fastmail CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jmapc>=0.2.0",
    "caldav>=1.3.0",
    "webdavclient3>=3.14.6",
    "typer>=0.12.0",
    "vobject>=0.9.9",
    "lxml>=5.0",
    "defusedxml>=0.7.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.8",
    "ruff>=0.9",
]

[project.scripts]
fmcli = "fmcli.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=fmcli --cov-report=term-missing"

[tool.ruff]
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
