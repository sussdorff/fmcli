name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchains:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check toolchain versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .agents/standards/toolchains/scripts/check_toolchain_versions.py

  quality:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-system

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true

      - name: Run test suite
        run: uv run pytest -v

      - name: Build package
        run: uv build
